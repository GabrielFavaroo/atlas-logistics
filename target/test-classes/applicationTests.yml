
spring:
  application:
    name: atlas-logistics
#  datasource:
#    url: jdbc:postgresql://localhost:5555/atlas-storage
#    username: postgres
#    password: '1515'
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true
  springdoc:
    hateoas:
      enabled: true
    show-actuator: true
    api-docs:
      path: /api-docs
      resolve-external-entities: true
    swagger-ui:
      path: /swagger-ui.html
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    hikari:
      connection-timeout: 30000
      validation-timeout: 3000
      maximum-pool-size: 20





server:
  servlet:
    session:
      timeout: 60m



